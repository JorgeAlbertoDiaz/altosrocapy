name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86, x64]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: ${{ matrix.arch }}

      - name: Install PyInstaller
        run: pip install pyinstaller openpyxl fpdf2 tkcalendar

      # build_windows.py valida que el Python (y por tanto el exe) coincida con
      # la arquitectura pedida; genera AltosRoca-<bits>.exe y AltosRoca.exe nativo.
      - name: Build (${{ matrix.arch }})
        shell: pwsh
        run: |
          $bits = if ('${{ matrix.arch }}' -eq 'x86') { '32' } else { '64' }
          python scripts/build_windows.py --bits $bits --dest _out

      - name: Create portable zip
        shell: pwsh
        run: |
          $bits = if ('${{ matrix.arch }}' -eq 'x86') { '32' } else { '64' }
          $exe = Get-ChildItem "_out/AltosRoca-$bits*.exe" | Select-Object -First 1
          Compress-Archive -Path $exe.FullName, "_out/data/altosroca.db" -DestinationPath "_out/AltosRoca-${{ matrix.arch }}.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AltosRoca-${{ matrix.arch }}
          path: |
            _out/*.exe
            _out/*.zip
            _out/data/altosroca.db
          if-no-files-found: error
